services:
  # Test PostgreSQL Database
  postgres-test:
    image: postgres:15-alpine
    container_name: test-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test Redis for queues and caching
  redis-test:
    image: redis:7-alpine
    container_name: test-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test Elasticsearch for search
  elasticsearch-test:
    image: elasticsearch:9.0.3
    container_name: test-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9201}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"  # Reduced resources for CI
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MailHog for email testing
  mailhog-test:
    image: mailhog/mailhog:latest
    container_name: test-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Ollama runtime — scraper reaches it via 127.0.0.1:${OLLAMA_PORT:-11435} in test
  ollama-test:
    image: ollama/ollama:0.21.1
    container_name: test-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data_test:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot sidecar: waits for ollama-test to be healthy, pulls the
  # configured model (cached in the volume so subsequent test runs are fast),
  # then exits. Never restarts.
  ollama-test-model-pull:
    image: ollama/ollama:0.21.1
    container_name: test-ollama-model-pull
    restart: "no"
    depends_on:
      ollama-test:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama-test:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'ollama pull "$${OLLAMA_MODEL}"'

volumes:
  ollama_data_test: